<script id="deck-data" type="application/json">[{"id":"fundamento","num":"Matriz 1","title":"Fundamento convencional directo","description":"Tres instrumentos que sostienen las obligaciones alimentarias y su aplicación en Bolivia.","icon":"scale","tag":"A","tone":"sage","headers":["Nº","Instrumento y disposición","Cat.","Contenido verificado","Vinculación con el derecho de alimentos","Correlato boliviano","Unidad","Enlace oficial","Verif."],"rows":[{"n":1,"cells":["1","Convención Americana sobre Derechos Humanos (Pacto de San José), 22 de noviembre de 1969. Artículo 7.7.","Categoría A","Única disposición de la CADH que menciona expresamente los deberes alimentarios: «Nadie será detenido por deudas. Este principio no limita los mandatos de autoridad judicial competente dictados por incumplimientos de deberes alimentarios».","Fundamento convencional directo del apremio corporal por incumplimiento de asistencia familiar. Permite sostener que el apremio no es prisión por deudas, sino una excepción convencionalmente autorizada, sujeta a reserva de ley y control de proporcionalidad.","Arts. 23.III y 117.III CPE; arts. 127.II y 415.III Ley 603.","Unidad IV, 4.4 y 4.6","https://www.corteidh.or.cr/tablas/17229a.pdf","Directa"]},{"n":2,"cells":["2","Convención sobre los Derechos del Niño, 20 de noviembre de 1989. Artículo 27, particularmente 27.4.","Categoría A","Reconoce el derecho a un nivel de vida adecuado, atribuye responsabilidad primordial a los padres dentro de sus posibilidades y medios económicos, impone al Estado medidas de ayuda y asistencia material, y obliga a adoptar todas las medidas apropiadas para asegurar el pago de la pensión alimenticia, incluido el supuesto transfronterizo.","Es la norma internacional que convierte el derecho de alimentos en obligación de resultado para el Estado. El párrafo 4 fundamenta el deber de disponer de mecanismos eficaces de determinación, ejecución y cooperación internacional.","Arts. 59, 60 y 64 CPE; art. 109 Ley 603; arts. 8 y 12 Ley 548.","Unidad II, 2.1 y 2.7; Unidad IV, 4.3","https://www.ohchr.org/es/instruments-mechanisms/instruments/convention-rights-child","Solo identificadores"]},{"n":3,"cells":["3","Convención Interamericana sobre Obligaciones Alimentarias, Montevideo, 15 de julio de 1989 (CIDIP-IV). Tratado OEA B-54.","Categoría A","Determina el derecho aplicable a las obligaciones alimentarias, la competencia internacional y la cooperación procesal cuando acreedor y deudor se encuentran en Estados Parte distintos. Se aplica a las obligaciones respecto de menores por su calidad de tales; considera menor a quien no ha cumplido dieciocho años.","Es el único instrumento interamericano específicamente alimentario que vincula a Bolivia. Concreta el mandato de cooperación del art. 27.4 CDN.","Arts. 502 a 508 Ley 439 (CPC); art. 38.8 Ley 025.","Unidad II, 2.6 y 2.7; Unidad IV, 4.3","https://www.oas.org/juridico/spanish/tratados/b-54.html","Directa"]}],"hasLink":true,"filterCol":2},{"id":"opiniones","num":"Matriz 2","title":"Opiniones consultivas de la Corte IDH","description":"Estándares interpretativos sobre niñez, garantías y derecho al cuidado.","icon":"book","tag":"A · B · C","tone":"lavender","headers":["Nº","Opinión consultiva","Fecha y Serie","Cat.","Contenido verificado","Vinculación con alimentos","Unidad","Enlace oficial","Verif."],"rows":[{"n":1,"cells":["1","Condición jurídica y derechos humanos del niño. Opinión Consultiva OC-17/02","28 de agosto de 2002 — Serie A No. 17","Categoría B","Alcance del art. 19 CADH interpretado a la luz de la CDN. Los niños son titulares de los derechos de toda persona y además de derechos especiales derivados de su condición, lo que genera deberes específicos de la familia, la sociedad y el Estado. La familia es el ámbito primordial de desarrollo y el Estado debe apoyarla y fortalecerla.","Arquitectura del deber de apoyo estatal a la familia. Si el Estado debe apoyar a la familia para que cumpla su función, con mayor razón debe disponer de mecanismos eficaces para que quien tiene el deber alimentario lo cumpla.","Unidad II, 2.5","https://www.corteidh.or.cr/docs/opiniones/seriea_17_esp.pdf","Directa"]},{"n":2,"cells":["2","Derechos y garantías de niñas y niños en el contexto de la migración y/o en necesidad de protección internacional. Opinión Consultiva OC-21/14","19 de agosto de 2014 — Serie A No. 21","Categoría C","Estándares de procedimiento y garantías aplicables a niñas y niños, incluidos el derecho a ser oído, la determinación del interés superior y el principio de unidad familiar.","Aplicación analógica: sus estándares procedimentales sirven para exigir que la niña o el niño beneficiario no sea tratado como objeto invisible dentro de un proceso alimentario conducido entre adultos.","Unidad II, 2.3; Unidad IV, 4.1","https://www.corteidh.or.cr/docs/opiniones/seriea_21_esp.pdf","Solo identificadores"]},{"n":3,"cells":["3","El contenido y el alcance del derecho al cuidado y su interrelación con otros derechos. Opinión Consultiva OC-31/25","Adoptada el 12 de junio de 2025; notificada el 7 de agosto de 2025 — Serie A No. 31","Categoría A","Reconoce el cuidado como derecho humano autónomo, con tres dimensiones: ser cuidado, cuidar y el autocuidado. Lo funda en los principios de corresponsabilidad social y familiar, solidaridad, e igualdad y no discriminación, precisando que la corresponsabilidad familiar implica responsabilidades equitativas entre hombres y mujeres.","Es el pronunciamiento interamericano más directo sobre la dimensión del sostenimiento y cuidado. Permite sostener que el cuidado cotidiano tiene valor jurídico y que la distribución de cargas alimentarias no puede apoyarse en roles de género preconstituidos.","Unidad II, 2.4; Unidad III, 3.3; Unidad IV, 4.7","https://www.corteidh.or.cr/docs/opiniones/seriea_31_esp.pdf","Directa"]}],"hasLink":true,"filterCol":3},{"id":"casos","num":"Matriz 3","title":"Jurisprudencia contenciosa de la Corte IDH","description":"Casos y sentencias con conexión directa, conexa o analógica con el derecho alimentario.","icon":"gavel","tag":"B · C","tone":"sand","headers":["Nº","Caso","Tipo y fecha","Serie","Cat.","Problema jurídico resuelto","Criterio o estándar verificado","Vinculación con alimentos y límites","Unidad","Enlace oficial","Verif."],"rows":[{"n":1,"cells":["1","Caso de los «Niños de la Calle» (Villagrán Morales y otros) Vs. Guatemala","Fondo, 19 de noviembre de 1999","Serie C No. 63","Categoría B","Muerte y tortura de niños en situación de calle; alcance del derecho a la vida respecto de personas menores de edad.","El derecho a la vida comprende no solo la prohibición de privación arbitraria, sino la obligación de garantizar condiciones que impidan impedir el acceso a una existencia digna. Primer desarrollo de la noción de vida digna en el sistema interamericano.","Conexa. Fundamenta que las condiciones materiales de existencia integran el contenido del derecho a la vida, premisa del nivel de vida adecuado del art. 27 CDN.","Unidad II, 2.5","https://biblioteca.corteidh.or.cr/documento/65184","Biblioteca"]},{"n":2,"cells":["2","Caso «Instituto de Reeducación del Menor» Vs. Paraguay","Excepciones Preliminares, Fondo, Reparaciones y Costas, 2 de septiembre de 2004","Serie C No. 112","Categoría B","Condiciones de internamiento de adolescentes privados de libertad; obligaciones especiales del Estado como garante.","El Estado asume obligaciones especiales reforzadas respecto de niños bajo su custodia, incluida la provisión de condiciones materiales de vida. Desarrolla el corpus iuris de protección de la niñez.","Conexa. La noción de obligación reforzada y de corpus iuris es la base metodológica para integrar CDN y CADH en materia alimentaria.","Unidad II, 2.5","https://www.corteidh.or.cr/docs/casos/articulos/seriec_112_esp.pdf","Directa"]},{"n":3,"cells":["3","Caso de las niñas Yean y Bosico Vs. República Dominicana","Fondo, 8 de septiembre de 2005","Serie C No. 130","Categoría C","Denegación de inscripción de nacimiento y sus efectos sobre nacionalidad, identidad y acceso a la educación.","La falta de reconocimiento de la personalidad jurídica y de la identidad impide el ejercicio de otros derechos y coloca al niño en situación de vulnerabilidad extrema.","Analógica. Útil para el presupuesto de filiación e identidad como condición de exigibilidad del derecho alimentario.","Unidad III, 3.1","https://www.corteidh.or.cr/docs/casos/articulos/seriec_130_esp.pdf","Solo identificadores"]},{"n":4,"cells":["4","Caso Comunidad Indígena Yakye Axa Vs. Paraguay","Fondo, Reparaciones y Costas, 17 de junio de 2005","Serie C No. 125","Categoría B","Falta de acceso a tierra, agua, alimentación y salud de una comunidad indígena, con afectación específica de niñas y niños.","Desarrolla el derecho a una vida digna como obligación positiva de proveer o no impedir el acceso a condiciones materiales básicas, incluida la alimentación.","Conexa. Aporta el contenido material del estándar de vida digna que sirve para interpretar el nivel de vida adecuado.","Unidad II, 2.5; Unidad IV, 4.7","https://www.corteidh.or.cr/docs/casos/articulos/seriec_125_esp.pdf","Solo identificadores"]},{"n":5,"cells":["5","Caso Comunidad Indígena Sawhoyamaxa Vs. Paraguay","Fondo, Reparaciones y Costas, 29 de marzo de 2006","Serie C No. 146","Categoría B","Muerte de niñas y niños de la comunidad por falta de acceso a agua, alimentación y atención de salud.","Responsabilidad estatal por omisión cuando el Estado conoce una situación de riesgo real e inmediato para la vida de niñas y niños y no adopta medidas razonables.","Conexa. Traslada al plano alimentario la idea de que el conocimiento del riesgo genera deber de actuación, relevante cuando el incumplimiento alimentario es conocido por el juez.","Unidad IV, 4.7","https://biblioteca.corteidh.or.cr/documento/65116","Biblioteca"]},{"n":6,"cells":["6","Caso Comunidad Indígena Xákmok Kásek Vs. Paraguay","Fondo, Reparaciones y Costas, 24 de agosto de 2010","Serie C No. 214","Categoría B","Condiciones de vida de una comunidad indígena; agua, alimentación, salud y educación, con medidas específicas para niñas y niños.","Reitera y precisa el estándar de vida digna y ordena medidas diferenciadas en favor de niñas y niños de la comunidad.","Conexa. Sustenta la exigencia de adecuación del contenido prestacional a las circunstancias concretas del beneficiario.","Unidad II, 2.5; Unidad III, 3.3","https://biblioteca.corteidh.or.cr/documento/65738","Biblioteca"]},{"n":7,"cells":["7","Caso Atala Riffo y niñas Vs. Chile","Fondo, Reparaciones y Costas, 24 de febrero de 2012","Serie C No. 239","Categoría B","Retiro de la tuición de tres niñas fundado en la orientación sexual de la madre; uso de estereotipos en la determinación del interés superior.","Párrafo 109: la determinación del interés superior en casos de cuidado y custodia debe hacerse a partir de la evaluación de comportamientos parentales específicos y de daños o riesgos reales y probados, no especulativos o imaginarios; no son admisibles especulaciones, presunciones, estereotipos ni consideraciones generalizadas.","Conexa de alto valor operativo. Prohíbe presumir capacidad económica, necesidades o irresponsabilidad parental sobre la base de estereotipos de género o juicios morales, exigencia directamente aplicable a la fijación y modificación de la asistencia.","Unidad II, 2.5; Unidad III, 3.3; Unidad IV, 4.5","https://www.corteidh.or.cr/docs/casos/articulos/seriec_239_esp.pdf","Directa"]},{"n":8,"cells":["8","Caso Fornerón e hija Vs. Argentina","Fondo, Reparaciones y Costas, 27 de abril de 2012","Serie C No. 242","Categoría B","Entrega en guarda preadoptiva de una niña sin consentimiento del padre biológico y demora excesiva de los procesos internos.","El Estado debe garantizar el derecho del niño a la protección de la familia y adoptar medidas eficaces y oportunas; la duración irrazonable del proceso puede consumar por sí misma la violación. Reitera el estándar de Atala Riffo sobre interés superior.","Conexa central para exigibilidad. El tiempo procesal es un factor de vulneración autónomo, argumento decisivo frente a la dilación en procesos de fijación, liquidación y ejecución de alimentos.","Unidad IV, 4.1 y 4.3","https://www.corteidh.or.cr/docs/casos/articulos/seriec_242_esp.pdf","Directa"]},{"n":9,"cells":["9","Caso Furlán y familiares Vs. Argentina","Excepciones Preliminares, Fondo, Reparaciones y Costas, 31 de agosto de 2012","Serie C No. 246","Categoría B","Demora de más de doce años en un proceso civil de indemnización en favor de un niño con discapacidad, y ejecución de la sentencia mediante títulos públicos.","La persona en situación de vulnerabilidad es titular de protección especial. La demora en el proceso civil y la forma de ejecución de lo debido comprometen el acceso a la justicia y los derechos del niño. El plazo razonable debe apreciarse con mayor rigor cuando está en juego la situación de una persona con discapacidad.","Conexa de máxima pertinencia. Es el precedente interamericano más cercano al problema de la ejecución civil ineficaz de una suma debida a un niño, que es exactamente el problema de la asistencia familiar devengada e impaga.","Unidad IV, 4.1, 4.3 y 4.7","https://www.corteidh.or.cr/docs/casos/articulos/seriec_246_esp.pdf","Directa"]},{"n":10,"cells":["10","Caso Familia Pacheco Tineo Vs. Bolivia","Excepciones Preliminares, Fondo, Reparaciones y Costas, 25 de noviembre de 2013","Serie C No. 272","Categoría B","Expulsión de una familia con niñas y niños del territorio boliviano sin garantías de debido proceso ni consideración del interés superior.","En todo procedimiento que involucre a niñas y niños, el Estado debe evaluar y determinar su interés superior y garantizar su derecho a ser oído. La condición de niño exige adecuar el procedimiento.","Conexa, con valor especial por ser un caso contra Bolivia. Obliga a la autoridad boliviana a evaluar el interés superior con estándar interamericano en todo procedimiento que afecte a una niña o niño, incluidos los familiares.","Unidad II, 2.5; Unidad IV, 4.5 y 4.6","https://www.corteidh.or.cr/docs/casos/articulos/seriec_272_esp.pdf","Directa"]},{"n":11,"cells":["11","Caso Espinoza Gonzáles Vs. Perú","Excepciones Preliminares, Fondo, Reparaciones y Costas, 20 de noviembre de 2014","Serie C No. 289","Categoría C","Detención ilegal y arbitraria; contenido del art. 7.2 CADH y de la reserva legal en materia de privación de libertad.","Párrafo 109: el examen del art. 7.2 exige verificar el cumplimiento de los requisitos establecidos tan concretamente como sea posible y de antemano en cuanto a causas y condiciones de la privación de libertad; si la normativa interna no es observada, la privación es ilegal y contraria a la Convención.","Analógica, pero efectivamente utilizada. El Tribunal Constitucional Plurinacional cita este párrafo para resolver que el apremio corporal no procede por gastos extraordinarios, al no estar previsto expresamente en la ley.","Unidad IV, 4.4 y 4.6","https://corteidh.or.cr/docs/casos/articulos/seriec_289_esp.pdf","Directa"]},{"n":12,"cells":["12","Caso Gonzales Lluy y otros Vs. Ecuador","Excepciones Preliminares, Fondo, Reparaciones y Costas, 1 de septiembre de 2015","Serie C No. 298","Categoría B","Contagio de VIH a una niña por transfusión en un banco de sangre privado; efectos sobre salud, educación y proyecto de vida.","Responsabilidad estatal por deficiencias en la supervisión de servicios prestados por particulares. Desarrolla interseccionalidad de la vulnerabilidad y protección de salud y educación de la niña.","Conexa. Aporta el análisis interseccional que permite fundamentar necesidades alimentarias diferenciadas y agravadas en el caso concreto.","Unidad III, 3.3; Unidad IV, 4.7","https://biblioteca.corteidh.or.cr/documento/65759","Biblioteca"]},{"n":13,"cells":["13","Caso V.R.P., V.P.C. y otros Vs. Nicaragua","Excepciones Preliminares, Fondo, Reparaciones y Costas, 8 de marzo de 2018","Serie C No. 350","Categoría B","Violencia sexual contra una niña y revictimización durante el proceso penal.","Desarrolla la justicia adaptada a niñas, niños y adolescentes: especialización, acompañamiento, participación adecuada y prohibición de revictimización procesal.","Conexa. Sustenta la exigencia de un procedimiento adaptado también en la jurisdicción familiar, no solo penal.","Unidad II, 2.3; Unidad IV, 4.1","https://www.corteidh.or.cr/docs/casos/articulos/seriec_350_esp.pdf","Solo identificadores"]},{"n":14,"cells":["14","Caso Ramírez Escobar y otros Vs. Guatemala","Fondo, Reparaciones y Costas, 9 de marzo de 2018","Serie C No. 351","Categoría B","Adopciones internacionales irregulares y separación de niños de su familia biológica fundada en su situación económica y en estereotipos sobre la madre.","Reitera el estándar de Atala Riffo sobre interés superior y precisa que la pobreza no puede ser por sí misma causa de separación familiar; la separación exige razones excepcionales y medidas menos lesivas previas.","Conexa central. Distingue la insolvencia real del obligado, que es un problema de capacidad, de la renuencia, que es un problema de ejecución, y prohíbe tratar la pobreza como falta.","Unidad II, 2.5; Unidad III, 3.3; Unidad IV, 4.7","https://www.corteidh.or.cr/docs/casos/articulos/seriec_351_esp.pdf","Solo identificadores"]},{"n":15,"cells":["15","Caso Empleados de la Fábrica de Fuegos de Santo Antônio de Jesus y sus familiares Vs. Brasil","Excepciones Preliminares, Fondo, Reparaciones y Costas, 15 de julio de 2020","Serie C No. 407","Categoría C","Explosión en una fábrica de fuegos artificiales con víctimas niñas, niños y mujeres en situación de pobreza estructural; trabajo infantil.","Justiciabilidad directa del art. 26 CADH; prohibición de discriminación por posición económica; obligación de fiscalización estatal.","Analógica. Base para sostener la exigibilidad directa de derechos económicos y sociales, premisa de la responsabilidad estatal por ineficacia del sistema alimentario.","Unidad IV, 4.7 y 4.8","https://www.corteidh.or.cr/docs/casos/articulos/seriec_407_esp.pdf","Solo identificadores"]},{"n":16,"cells":["16","Caso Angulo Losada Vs. Bolivia","Fondo, Reparaciones y Costas, 18 de noviembre de 2022","Serie C No. 475","Categoría B","Violencia sexual contra una adolescente en Bolivia; deficiencias del proceso penal y revictimización; estereotipos de género en la valoración judicial.","Desarrolla la debida diligencia reforzada y la obligación de adecuar los procedimientos internos al interés superior, con órdenes concretas de reforma normativa y de capacitación a operadores bolivianos.","Conexa, con valor especial por ser un caso contra Bolivia con medidas de reparación estructural. Sustenta el deber de capacitación y de adecuación procedimental exigible también a la jurisdicción familiar boliviana.","Unidad IV, 4.5, 4.6 y 4.7","https://www.corteidh.or.cr/docs/casos/articulos/seriec_475_esp.pdf","Directa"]}],"hasLink":true,"filterCol":4},{"id":"convencion","num":"Matriz 5","title":"Convención sobre los Derechos del Niño","description":"Correspondencia artículo por artículo entre las reglas de la Convención y el ordenamiento boliviano.","icon":"shield","tag":"19 reglas","tone":"blue","headers":["Art. CDN","Regla convencional verificada","Correlato en la norma boliviana","Consecuencia para el derecho de alimentos","Unidad"],"rows":[{"n":1,"cells":["Art. 2","No discriminación. Los Estados respetan los derechos de cada niño sin distinción alguna, incluida la posición económica, y respecto de la condición de sus padres.","Arts. 14.II y 59.IV CPE (igualdad entre hijas e hijos con independencia del origen); art. 12 inc. b) Ley 548.","Prohíbe diferenciar el contenido del derecho alimentario según el estado civil de los progenitores o el tipo de filiación.","Unidad II, 2.1; Unidad III, 3.2"]},{"n":2,"cells":["Art. 3.1","El interés superior del niño como consideración primordial en todas las medidas que le conciernan, adoptadas por tribunales, autoridades administrativas u órganos legislativos.","Art. 60 CPE; art. 12 inc. a) Ley 548; arts. 6 inc. i) y 109.I Ley 603.","Obliga a evaluar y determinar el interés superior en la fijación, modificación y ejecución de la asistencia, con motivación verificable.","Unidad III, 3.3; Unidad IV, 4.5"]},{"n":3,"cells":["Art. 3.2","Los Estados aseguran al niño la protección y el cuidado necesarios, teniendo en cuenta los derechos y deberes de sus padres o responsables.","Arts. 59.I y 64 CPE; art. 8 Ley 548.","Articula deber familiar primario y deber estatal de garantía, sin sustitución automática.","Unidad IV, 4.7"]},{"n":4,"cells":["Art. 4","Adopción de todas las medidas legislativas, administrativas y de otra índole; respecto de los derechos económicos, sociales y culturales, hasta el máximo de los recursos disponibles.","Art. 13.I CPE; art. 8.II Ley 548; art. 15 Ley 548 (asignación de recursos).","Fundamenta el examen de suficiencia presupuestaria e institucional del sistema de justicia familiar.","Unidad IV, 4.7 y 4.8"]},{"n":5,"cells":["Art. 5","Responsabilidades, derechos y deberes de los padres o responsables de impartir dirección y orientación, en consonancia con la evolución de las facultades del niño.","Arts. 40 y ss. Ley 603 (autoridad parental); art. 12 inc. h) Ley 548 (ejercicio progresivo).","Sustituye la lógica de potestad por la de función ejercida en beneficio del hijo, lo que impide tratar la prestación alimentaria como concesión del adulto.","Unidad III, 3.7"]},{"n":6,"cells":["Art. 6","Derecho intrínseco a la vida y garantía, en la máxima medida posible, de la supervivencia y el desarrollo del niño.","Arts. 15.I y 59.I CPE; art. 12 inc. e) Ley 548.","Convierte el desarrollo, y no la mera subsistencia, en el parámetro de suficiencia de la prestación.","Unidad II, 2.1"]},{"n":7,"cells":["Art. 9","No separación del niño de sus padres salvo cuando sea necesario en su interés superior, y derecho a mantener relaciones con ambos progenitores.","Art. 59.II CPE; arts. 39 y ss. Ley 548.","Fundamenta la autonomía entre el deber alimentario y el régimen de visitas: ninguno puede condicionar al otro.","Unidad III, 3.7"]},{"n":8,"cells":["Art. 12","Derecho del niño a ser escuchado en todo procedimiento judicial o administrativo que le afecte, directamente o por medio de representante, según su edad y madurez.","Art. 12 inc. g) Ley 548; arts. 8 y 9 Ley 548.","Exige prever la participación del beneficiario en el proceso alimentario, de manera adecuada a su edad, y no solo la actuación de su representante.","Unidad II, 2.3; Unidad IV, 4.1"]},{"n":9,"cells":["Art. 18.1","Obligaciones comunes de ambos padres en la crianza y el desarrollo, con el interés superior como preocupación fundamental.","Art. 64.I CPE; art. 108.9 CPE.","Es la base convencional de la corresponsabilidad y de la prohibición de distribuir cargas conforme a estereotipos de género.","Unidad III, 3.3; Unidad IV, 4.7"]},{"n":10,"cells":["Art. 18.2","Asistencia apropiada del Estado a los padres para el desempeño de sus funciones de crianza, y creación de instituciones y servicios de cuidado.","Art. 64.II CPE; art. 8.II Ley 548.","Fundamenta la exigibilidad de servicios públicos de cuidado y apoyo, no solo de la sanción al incumplidor.","Unidad IV, 4.7"]},{"n":11,"cells":["Art. 20","Protección y asistencia especiales del niño privado de su medio familiar; cuidados alternativos.","Arts. 52 y ss. Ley 548 (guarda, tutela, acogimiento).","Delimita el punto de contacto entre asistencia familiar y familia ampliada o guardadores, incluido el problema de la legitimación para demandar.","Unidad III, 3.6"]},{"n":12,"cells":["Art. 23","Derechos del niño con discapacidad; cuidados especiales y asistencia adecuada a su condición y a la situación de sus padres.","Art. 71 CPE; art. 109.IV Ley 603 (asistencia mientras dure la discapacidad).","Fundamenta la extensión y la intensidad diferenciada de la prestación en casos de discapacidad.","Unidad III, 3.5"]},{"n":13,"cells":["Art. 24","Derecho al disfrute del más alto nivel posible de salud y a servicios de tratamiento y rehabilitación.","Art. 18 CPE; art. 109.I Ley 603 (salud como componente).","Sustenta la inclusión de gastos de salud en el contenido de la asistencia y su carácter no discrecional.","Unidad III, 3.4"]},{"n":14,"cells":["Art. 26","Derecho del niño a beneficiarse de la seguridad social, teniendo en cuenta los recursos y la situación del niño y de las personas responsables de su mantenimiento.","Arts. 45 y 67 CPE; normativa de seguridad social de corto y largo plazo.","Es la disposición que conecta el derecho alimentario con las prestaciones de seguridad social, contenido mínimo institucional frecuentemente omitido.","Unidad IV, 4.7"]},{"n":15,"cells":["Art. 27.1","Derecho a un nivel de vida adecuado para el desarrollo físico, mental, espiritual, moral y social.","Arts. 16, 17, 18, 19 y 59.I CPE; art. 109.I Ley 603.","Es el eje internacional del módulo. Fija un estándar de desarrollo y no de supervivencia.","Unidad II, 2.1"]},{"n":16,"cells":["Art. 27.2","Responsabilidad primordial de los padres de proporcionar las condiciones de vida necesarias, dentro de sus posibilidades y medios económicos.","Art. 116.I Ley 603 (proporción entre necesidades y posibilidades).","Correlato casi literal del criterio boliviano de determinación; permite el control de convencionalidad de la cuantía.","Unidad III, 3.3"]},{"n":17,"cells":["Art. 27.3","Deber estatal de adoptar medidas apropiadas para ayudar a los padres y, en caso necesario, proporcionar asistencia material y programas de apoyo, particularmente en nutrición, vestuario y vivienda.","Art. 64.II CPE; políticas de protección social.","Distingue apoyo estatal de sustitución del deudor alimentario.","Unidad IV, 4.7"]},{"n":18,"cells":["Art. 27.4","Deber de adoptar todas las medidas apropiadas para asegurar el pago de la pensión alimenticia, incluido cuando el obligado vive en el extranjero, y de promover la adhesión a convenios internacionales.","Arts. 127 y 415 Ley 603; arts. 502 a 508 Ley 439; art. 38.8 Ley 025; Convención Interamericana sobre Obligaciones Alimentarias.","Convierte la efectividad del cobro en obligación internacional del Estado y habilita evaluar su cumplimiento por la eficacia real de la ejecución.","Unidad II, 2.7; Unidad IV, 4.3"]},{"n":19,"cells":["Art. 28","Derecho a la educación, con gratuidad y obligatoriedad de la enseñanza primaria y accesibilidad de la enseñanza superior.","Arts. 17, 77.II y 82.I CPE; art. 109.I y II Ley 603.","Fundamenta la educación como componente de la asistencia y la extensión de la prestación durante la formación técnica o profesional.","Unidad III, 3.5"]}],"hasLink":false,"filterCol":null},{"id":"observaciones","num":"Matriz 6","title":"Observaciones generales pertinentes","description":"Interpretaciones especializadas de los Comités de Naciones Unidas aplicables al módulo.","icon":"file","tag":"10 documentos","tone":"rose","headers":["Órgano emisor","Observación general","Símbolo","Fecha","Aporte al módulo","Unidad","Enlace","Verif."],"rows":[{"n":1,"cells":["Comité de los Derechos del Niño","Observación General 5, Medidas generales de aplicación de la Convención sobre los Derechos del Niño (arts. 4, 42 y 44, párr. 6)","CRC/GC/2003/5","27 de noviembre de 2003","La aplicación exige medidas legislativas, administrativas, de coordinación, de asignación de recursos y de seguimiento. Impide reducir el cumplimiento estatal a la ratificación formal.","Unidad IV, 4.7","https://www.ohchr.org/es/documents/general-comments-and-recommendations/crcgc20035-general-comment-no-5-2003-general","Solo identificadores"]},{"n":2,"cells":["Comité de los Derechos del Niño","Observación General 7, Realización de los derechos del niño en la primera infancia","CRC/C/GC/7/Rev.1","2005, versión revisada de 2006","Los primeros años son un periodo crítico y todos los derechos de la Convención se aplican plenamente desde esa etapa.","Unidad II, 2.1; Unidad III, 3.3","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":3,"cells":["Comité de los Derechos del Niño","Observación General 12, El derecho del niño a ser escuchado","CRC/C/GC/12","20 de julio de 2009","Participación e interés superior son principios complementarios, no alternativos. El art. 12.2 garantiza la oportunidad de ser escuchado en todo procedimiento judicial o administrativo que afecte al niño.","Unidad II, 2.3; Unidad IV, 4.1","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":4,"cells":["Comité de los Derechos del Niño","Observación General 14, sobre el derecho del niño a que su interés superior sea una consideración primordial (art. 3, párr. 1)","CRC/C/GC/14","29 de mayo de 2013","Triple dimensión del interés superior: derecho sustantivo, principio interpretativo y norma de procedimiento (párr. 6). Distinción entre evaluación y determinación del interés superior (párr. 47). Elementos a ponderar (párr. 52 y ss.).","Unidad III, 3.3; Unidad IV, 4.5","https://www.ohchr.org/es/documents/general-comments-and-recommendations/crccgc14-general-comment-no-14-2013-right-child","Solo identificadores"]},{"n":5,"cells":["Comité de los Derechos del Niño","Observación General 19, sobre la elaboración de presupuestos públicos para hacer efectivos los derechos del niño (art. 4)","CRC/C/GC/19","20 de julio de 2016","Los derechos del niño deben reflejarse en decisiones presupuestarias, con suficiencia, eficacia, equidad, transparencia y sostenibilidad.","Unidad IV, 4.7 y 4.8","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":6,"cells":["Comité de los Derechos del Niño","Observación General 20, sobre la efectividad de los derechos del niño durante la adolescencia","CRC/C/GC/20","6 de diciembre de 2016","Obligaciones específicas respecto de adolescentes, autonomía progresiva y necesidades diferenciadas de desarrollo.","Unidad II, 2.3; Unidad III, 3.5","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":7,"cells":["Comité de los Derechos del Niño","Observación General 21, sobre los niños en situación de calle","CRC/C/GC/21","21 de junio de 2017","Vincula desprotección material y familiar con vulneración estructural de derechos; enfoque de derechos y no de tutela.","Unidad IV, 4.7","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":8,"cells":["Comité de los Derechos del Niño","Observación General 27, sobre el derecho del niño al acceso a la justicia y a un recurso efectivo","CRC/C/GC/27","2024","Documento más reciente y directamente pertinente para la Unidad IV: acceso a la justicia, recursos efectivos y remedios para niñas, niños y adolescentes.","Unidad IV, 4.1, 4.3 y 4.6","https://www.ohchr.org/es/treaty-bodies/crc/general-comments","Solo identificadores"]},{"n":9,"cells":["Comité de Derechos Económicos, Sociales y Culturales","Observación General 12, El derecho a una alimentación adecuada (art. 11 del PIDESC)","E/C.12/1999/5","12 de mayo de 1999","La alimentación adecuada no se reduce a un mínimo de calorías: exige disponibilidad, accesibilidad y adecuación en condiciones compatibles con la dignidad.","Unidad II, 2.1","https://www.acnur.org/fileadmin/Documentos/BDL/2001/1450.pdf","Directa"]},{"n":10,"cells":["Comité de Derechos Económicos, Sociales y Culturales","Observación General 19, El derecho a la seguridad social (art. 9 del PIDESC)","E/C.12/GC/19","Aprobada en 2007; distribuida en español el 4 de febrero de 2008","Contenido del derecho a la seguridad social, incluidas prestaciones familiares y por hijos a cargo. Es la pieza que permite trabajar el contenido mínimo institucional de seguridad social exigido por ESAM.","Unidad IV, 4.7","https://www.acnur.org/fileadmin/Documentos/BDL/2012/8791.pdf","Directa"]}],"hasLink":true,"filterCol":null}]</script><script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('deck-data').textContent);const CDN='https://www.ohchr.org/es/instruments-mechanisms/instruments/convention-rights-child';const $=id=>document.getElementById(id);let slides=[{kind:'cover'},{kind:'menu'}];for(const s of data){slides.push({kind:'chapter',s});slides.push({kind:'table',s});for(const r of s.rows)slides.push({kind:'record',s,r})}let pos=0;let font=1;let query='';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const trim=s=>String(s||'').replace(/\s+/g,' ').trim();const url=x=>{try{let u=new URL(trim(x));return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}};
const icons={scale:'<path d="M12 2v19M5 6h14M4 6l-3 6h6l-3-6Zm16 0-3 6h6l-3-6ZM7 21h10M9 17h6"/>',book:'<path d="M4 3h7a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3H4a2 2 0 0 0-2 2V5a2 2 0 0 1 2-2Zm16 0h-4a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3h4a2 2 0 0 1 2 2V5a2 2 0 0 0-2-2Z"/>',gavel:'<path d="m14 3 7 7-3 3-7-7 3-3ZM6 11l7 7-3 3-7-7 3-3ZM12 7l-5 5m12-1-5 5M2 22h15"/>',shield:'<path d="m12 2 9 4v6c0 6-4 9-9 11-5-2-9-5-9-11V6l9-4Zm-4 10 3 3 5-6"/>',file:'<path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c-6 5-6 15 0 20M12 2c6 5 6 15 0 20"/>'};function icon(n,size=25){return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[n]||icons.scale}</svg>`} $('logo').innerHTML=icon('scale',25);
const labels={fundamento:'Fundamento convencional directo',opiniones:'Opiniones consultivas',casos:'Casos contenciosos',convencion:'Reglas CDN y norma boliviana',observaciones:'Observaciones generales'};const accents=['#e6f0e9','#eee9f7','#e8f1f8','#f9f0e2','#f6e8e7'];
function idx(s){return slides.findIndex(x=>x.kind==='chapter'&&x.s.id===s.id)};function tableidx(s){return slides.findIndex(x=>x.kind==='table'&&x.s.id===s.id)};function recidx(s,r){return slides.findIndex(x=>x.kind==='record'&&x.s.id===s.id&&x.r.n===r.n)};function jump(i){pos=Math.min(slides.length-1,Math.max(0,i));query='';render();history.replaceState(null,'','#diapositiva-'+(pos+1));}
function menu(){return `<div class="headrow"><div class="hgroup"><div class="eyebrow">Rutas de consulta</div><h1>Seleccione la matriz que desea presentar</h1><p>Cada botón abre su colección de registros. Desde allí puede ir a una fuente concreta o visualizar la tabla original completa.</p></div><span class="tag">5 matrices · 51 registros</span></div><div class="grid">${data.map((s,i)=>`<button type="button" class="navcard" data-chapter="${esc(s.id)}"><i style="background:${accents[i]}">${icon(s.icon,23)}</i><h3>${esc(labels[s.id])}</h3><p>${esc(s.description)}</p><span class="arrow">${esc(s.num)} · ${s.rows.length} registros &nbsp;↗</span></button>`).join('')}</div><p class="speaker-note">Las denominaciones, textos y estados de verificación se conservan del catálogo aportado. La presentación reorganiza únicamente la forma de consulta.</p>`}
function cover(){return `<div class="hero"><div class="eyebrow">Atlas jurídico · versión para exposición</div><h1>Derecho alimentario y protección convencional de la niñez</h1><p>Matrices académicas con navegación por diapositivas, fichas de lectura ampliada y acceso directo a documentos de organismos internacionales.</p><div class="actions"><button class="primary" data-pos="1">Iniciar presentación →</button><button class="secondary" id="coverfull">⛶ Pantalla completa</button></div><div class="tinyrow"><span class="pill">5 matrices</span><span class="pill">51 fichas jurídicas</span><span class="pill">Fuentes clicables</span><span class="pill">Sin conexión para la lectura</span></div></div>`}
function chapter(s){return `<div class="matrixhead"><div class="mat-icon" style="background:${accents[data.indexOf(s)]}">${icon(s.icon,31)}</div><div><div class="eyebrow">${esc(s.num)} · ${s.rows.length} registros</div><h1>${esc(labels[s.id])}</h1><p>${esc(s.description)}</p></div></div><div class="toolbar"><input type="search" id="search" placeholder="Buscar registro, artículo, caso o año…" aria-label="Buscar registros en esta matriz" value="${esc(query)}"><button class="secondary" data-pos="${tableidx(s)}">▤ Ver tabla completa</button></div><div class="recordlist" id="recList">${list(s)}</div>`}
function list(s){let v=s.rows.filter(r=>!query||r.cells.join(' ').toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));if(!v.length)return '<p class="empty">No se encontraron coincidencias.</p>';let t=s.id==='convencion'?0:1;return v.map(r=>`<button type="button" class="recbtn" data-pos="${recidx(s,r)}"><span class="num">${String(r.n).padStart(2,'0')}</span><div><b>${esc(r.cells[t])}</b><small>Ir a la ficha jurídica · ${esc(s.num)}</small></div><span>↗</span></button>`).join('')}
function table(s){return `<div class="headrow" style="margin-bottom:9px"><div class="hgroup"><div class="eyebrow">${esc(s.num)} · vista íntegra</div><h1>${esc(labels[s.id])}</h1><p>Desplace la tabla horizontalmente para leer todas las columnas sin comprimir su texto.</p></div><button class="secondary" data-pos="${idx(s)}">← Volver a registros</button></div><div class="tableholder"><table class="matrixtable"><thead><tr>${s.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.cells.map((v,i)=>{let isurl=s.headers[i]==='Enlace oficial'||s.headers[i]==='Enlace';let href=isurl?url(v):null;return `<td>${href?`<a target="_blank" rel="noopener noreferrer" href="${esc(href)}">Abrir fuente oficial ↗<br><small>${esc(v)}</small></a>`:esc(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="tablehint"><span>↔ Desplazamiento horizontal disponible</span><span class="linkhint">Los enlaces subrayados son activos ↗</span></div>`}
function record(s,r){let ti=s.id==='convencion'?0:1;let title=r.cells[ti],v=s.headers.map((h,i)=>({h,v:r.cells[i],i}));let linkIdx=s.headers.findIndex(x=>x==='Enlace oficial'||x==='Enlace');let href=linkIdx>=0?url(r.cells[linkIdx]):null;let cat=s.filterCol!=null?r.cells[s.filterCol]:'';let omit=new Set([ti]);if(ti!==0)omit.add(0);if(linkIdx>=0)omit.add(linkIdx);return `<div class="recordframe"><aside class="recordaside"><div class="eyebrow">${esc(s.num)} · FICHA ${String(r.n).padStart(2,'0')}</div><h1>${esc(title)}</h1>${cat?`<span class="cat">${esc(cat)}</span>`:''}<p>${esc(labels[s.id])}</p><div class="go"><button class="secondary" data-pos="${idx(s)}">☷ Ver registros</button> <button class="secondary" data-pos="${tableidx(s)}">▤ Tabla completa</button></div></aside><div class="recordbody">${v.filter(x=>!omit.has(x.i)).map(x=>`<section class="field"><label>${esc(x.h)}</label><div>${esc(x.v)}</div></section>`).join('')}${href?`<section class="field source"><label>Documento oficial</label><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">Abrir fuente oficial ↗</a><div style="font-size:11px;color:#567a71;margin-top:7px">${esc(href)}</div></section>`:''}${s.id==='convencion'?`<section class="field source"><label>Consulta normativa general</label><a href="${CDN}" target="_blank" rel="noopener noreferrer">Convención sobre los Derechos del Niño ↗</a><div style="font-size:11px;color:#567a71;margin-top:7px">En el documento de origen esta matriz no tiene una columna de hipervínculos.</div></section>`:''}<div style="font-size:11px;color:#91a09a;padding:2px 4px 10px">Contenido y calificación de verificación reproducidos del catálogo aportado; no implican nueva comprobación del servidor de destino.</div></div></div>`}
function render(){let o=slides[pos];$('view').innerHTML=o.kind==='cover'?cover():o.kind==='menu'?menu():o.kind==='chapter'?chapter(o.s):o.kind==='table'?table(o.s):record(o.s,o.r);$('prev').disabled=pos===0;$('next').disabled=pos===slides.length-1;$('count').textContent=(pos+1)+' / '+slides.length;$('progress').style.width=((pos+1)/slides.length*100)+'%';$('footdesc').textContent=o.s?esc(labels[o.s.id]):'Presentación y menú principal';if(o.kind==='chapter'){let inp=$('search');inp.oninput=()=>{query=inp.value;$('recList').innerHTML=list(o.s)}}let cf=$('coverfull');if(cf)cf.onclick=fullscreen;}
function overlay(open){$('overlay').classList.toggle('hide',!open)}$('floatgrid').innerHTML=`<button class="floater" data-pos="0">⌂ Portada<small>Volver al inicio</small></button><button class="floater" data-pos="1">☷ Menú principal<small>Elegir una matriz</small></button>${data.map(s=>`<button class="floater" data-chapter="${esc(s.id)}">${esc(s.num)} · ${esc(labels[s.id])}<small>${s.rows.length} registros</small></button>`).join('')}`;
function fullscreen(){if(!document.fullscreenElement){$('deck').requestFullscreen?.()}else{document.exitFullscreen?.()}}
document.body.addEventListener('click',e=>{let p=e.target.closest('[data-pos]');if(p){overlay(false);jump(Number(p.dataset.pos));return}let ch=e.target.closest('[data-chapter]');if(ch){let s=data.find(x=>x.id===ch.dataset.chapter);if(s){overlay(false);jump(idx(s))}}});$('menubtn').onclick=()=>overlay(true);$('closemenu').onclick=()=>overlay(false);$('overlay').onclick=e=>{if(e.target===$('overlay'))overlay(false)};$('prev').onclick=()=>jump(pos-1);$('next').onclick=()=>jump(pos+1);$('home').onclick=()=>jump(1);$('full').onclick=fullscreen;$('plus').onclick=()=>{font=Math.min(1.6,Math.round((font+.1)*10)/10);document.documentElement.style.setProperty('--fontboost',font)};$('minus').onclick=()=>{font=Math.max(.9,Math.round((font-.1)*10)/10);document.documentElement.style.setProperty('--fontboost',font)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){overlay(false);return}if(e.target.matches('input')||!$('overlay').classList.contains('hide'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();jump(pos+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();jump(pos-1)}if(e.key==='Home'){e.preventDefault();jump(1)}});let h=Number((location.hash.match(/diapositiva-(\d+)/)||[])[1]);if(h>0&&h<=slides.length)pos=h-1;render();
})();
</script></body></html>
